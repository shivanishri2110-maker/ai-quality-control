<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Quality Control Dashboard - Phase 1</title>
<style>
body {
  margin: 0; padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex; height: 100vh; background: #f0f2f5;
}

/* Sidebar */
#sidebar {
  width: 250px; background: #1e1e2f; color: #fff;
  display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
}
#sidebar h1 { margin:0 0 10px 0; font-size: 25px; color: #ffbb33; }
#sidebar p { margin: 3px 0; font-size: 14px; color: #ccc; }
.sidebar-section { margin-top: 20px; }
.counter-box {
  background: #2c2c44; padding: 10px; border-radius: 8px; margin-bottom: 10px;
  text-align: center;
}
.counter-box h4 { margin: 0; font-size: 14px; color: #fff; }
.counter-box p { margin: 0; font-size: 18px; font-weight: bold; color: #ffbb33; }

/* Main Content */
#main-content {
  flex: 1; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
}

#product-container { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 10px; }
#product-container img { width: 100%; height: 100%; object-fit: contain; }

#demoText {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: bold;
    color: rgba(255, 255, 255, 0.5);
    pointer-events: none;
    text-align: center ;
}

/* AI Status Text */
#aiStatus {
  margin-bottom: 15px; font-size: 18px; font-weight: bold; color: #333;
}

/* Controls */
#controls { display: flex; gap: 20px; margin-bottom: 20px; }
button {
  flex: 1; padding: 15px 20px; font-size: 16px; border: none; border-radius: 8px;
  cursor: pointer; transition: 0.2s;
}
#confirm { background-color: #4caf50; color: #fff; } /* Confirm = green */
#reject { background-color: #ff4c4c; color: #fff; }  /* Reject = red */
button:hover { transform: scale(1.05); }

/* Log panel */
#log-panel {
  height: 200px; background: #fff; border-radius: 8px; overflow-y: scroll;
  padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.log-entry { border-bottom: 1px solid #ccc; padding: 5px 0; font-size: 14px; }
.log-entry span { display: block; }

</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <h1>Company Name</h1>
  <p>X/Y, SIPCOT, CITY, STATE</p>
  <p>Manufacturing Plant</p>
  <p>Quality Control Department</p>

  <div class="sidebar-section">
    <div id="clock">--/--/---- --:--:--</div>
  </div>

  <div class="sidebar-section">
    <div class="counter-box">
      <h4>Defects Today</h4>
      <p id="defectCount">0</p>
    </div>
    <div class="counter-box">
      <h4>Clear Today</h4>
      <p id="clearCount">0</p>
    </div>
  </div>
</div>

<!-- Main Content -->
<div id="main-content">
  <div id="product-container">
    <img id="product-image" src="{{ url_for('video_feed') }}">
    <div id="demoText">LIVE : PRODUCT LINE FEED USING OPENCV</div>
  </div>

  <div id="aiStatus">AI status pending...</div>

  <div id="controls">
    <button id="confirm">Confirm</button>
    <button id="reject">Reject</button>
  </div>

  <div id="log-panel">
    <h3>Inspection Logs</h3>
  </div>
</div>

<script>
// Clock
const clock = document.getElementById('clock');
function formatDateTime(date){
  const dd = String(date.getDate()).padStart(2,'0');
  const mm = String(date.getMonth()+1).padStart(2,'0');
  const yyyy = date.getFullYear();
  const hh = String(date.getHours()).padStart(2,'0');
  const min = String(date.getMinutes()).padStart(2,'0');
  const sec = String(date.getSeconds()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${min}:${sec}`;
}
setInterval(()=>{ clock.textContent = formatDateTime(new Date()); },1000);

// OPTIONAL: Keep your old product simulation / logs if needed
</script>

</body>
</html>
